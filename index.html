<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0d9488" />
    
    <!-- Mencegah caching agresif pada index.html -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <link rel="preconnect" href="https://script.google.com" />
    <link rel="preconnect" href="https://script.googleusercontent.com" />
    <link rel="apple-touch-icon" href="/logo.png?v=2" />
    <link rel="icon" type="image/png" href="/logo.png?v=2" />
    <title>AluswahGO</title>
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        // Hanya inisialisasi OneSignal di domain asli untuk menghindari error di environment preview
        if (window.location.hostname.includes('portal.misitaluswah.sch.id')) {
          try {
            await OneSignal.init({
              appId: "7a7e3936-e5ec-4287-b2ef-90792bb5a567",
              safari_web_id: "web.onesignal.auto.32866db8-e87d-48d6-8bf4-a7b54cca5ee4"
            });
            OneSignal.Slidedown.promptPush();
          } catch (error) {
            console.error("OneSignal Init Error:", error);
          }
        } else {
          console.log("OneSignal dinonaktifkan di environment preview. Fitur ini akan berjalan normal di portal.misitaluswah.sch.id");
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
