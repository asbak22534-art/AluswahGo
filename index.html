    <title>AluswahGO</title>
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        // Hanya inisialisasi OneSignal di domain asli untuk menghindari error di environment preview
        if (window.location.hostname.includes('portal.misitaluswah.sch.id')) {
          try {
            await OneSignal.init({
              appId: "7a7e3936-e5ec-4287-b2ef-90792bb5a567",
              safari_web_id: "web.onesignal.auto.32866db8-e87d-48d6-8bf4-a7b54cca5ee4",
              serviceWorkerParam: { scope: '/' },
              serviceWorkerPath: 'sw.js'
            });
          } catch (error) {
            console.error("OneSignal Init Error:", error);
          }
        } else {
          console.log("OneSignal dinonaktifkan di environment preview. Fitur ini akan berjalan normal di portal.misitaluswah.sch.id");
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
