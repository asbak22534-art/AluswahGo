<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Cache control to prevent caching of index.html on mobile browsers -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="description" content="Portal Sekolah Digital MIS IT Al Uswah. Akses informasi pendaftaran siswa baru, kabar berita, jadwal akademik, layanan Al Qur'an, dan prestasi siswa." />
    <meta name="theme-color" content="#0d9488" />

    <link rel="preconnect" href="https://script.google.com" />
    <link rel="preconnect" href="https://script.googleusercontent.com" />
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/logo.png?v=3" type="image/png">
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png?v=3">
    <meta name="apple-mobile-web-app-title" content="MIS IT Al Uswah" />
    <meta name="application-name" content="MIS IT Al Uswah" />
    <title>MIS IT Al Uswah</title>
    <script>
      // Tangkap prompt instalasi sedini mungkin sebelum aplikasi React dimuat
      window.deferredPWAInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        // Biarkan browser menampilkan prompt instalasinya secara natural (desktop address bar / mobile pop-up)
        window.deferredPWAInstallPrompt = e;
      });

      // Tangani unhandled script error dari skrip eksternal (cross-origin) agar tidak memicu crash di environment iframe / preview
      window.onerror = function(message, source, lineno, colno, error) {
        if (message === 'Script error.' || !source || source === '') {
          return true; // Menandai error telah tertangani untuk mencegah unhandled exception
        }
        return false;
      };

      window.addEventListener('error', function(e) {
        if (
          e.message === 'Script error.' || 
          (!e.filename && !e.lineno) ||
          (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK'))
        ) {
          e.preventDefault();
          if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          return true;
        }
      }, true);

      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && (e.reason.message === 'Script error.' || String(e.reason).includes('Script error'))) {
          e.preventDefault();
          if (e.stopImmediatePropagation) e.stopImmediatePropagation();
        }
      }, true);
    </script>
    <script>
      // Hanya muat dan inisialisasi OneSignal di domain resmi untuk menghindari error lintas domain di environment preview/iframe
      if (window.location.hostname.includes('portal.misitaluswah.sch.id')) {
        window.OneSignalDeferred = window.OneSignalDeferred || [];
        const osScript = document.createElement('script');
        osScript.src = "https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js";
        osScript.defer = true;
        osScript.onerror = () => console.warn("Gagal memuat OneSignal SDK");
        document.head.appendChild(osScript);

        window.OneSignalDeferred.push(async function(OneSignal) {
          try {
            await OneSignal.init({
              appId: "7a7e3936-e5ec-4287-b2ef-90792bb5a567",
              safari_web_id: "web.onesignal.auto.32866db8-e87d-48d6-8bf4-a7b54cca5ee4",
              serviceWorkerPath: "OneSignalSDKWorker.js",
              serviceWorkerParam: { scope: "/" }
            });
            OneSignal.Slidedown.promptPush();

            OneSignal.Notifications.addEventListener('click', function(event) {
              try {
                localStorage.setItem('currentView', 'home');
              } catch (e) {
                console.error(e);
              }
              window.dispatchEvent(new CustomEvent('notification-clicked'));
              window.focus();
            });
          } catch (error) {
            console.error("OneSignal Init Error:", error);
          }
        });
      } else {
        console.log("OneSignal dinonaktifkan di environment preview/development.");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
